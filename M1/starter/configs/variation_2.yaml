model:
  id: "Qwen/Qwen3-0.6B"
  revision: "c1899de289a04d12100db370d81485cdf75e47ca"
  dtype: "bfloat16"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training:
  seed: 42
  max_length: 512
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  epochs: 5
  learning_rate: 0.0001
  warmup_ratio: 0.1
  weight_decay: 0.01
  logging_steps: 5
  save_strategy: "epoch"

experiment:
  hypothesis: "Variation 1 (5 epoques, lr 2e-4) sert de nouvelle base locale pour isoler le learning rate : si on le reduit a 1e-4 en gardant 5 epoques, alors l'apprentissage devrait etre plus stable, mais risque de ne pas converger autant en 5 epoques, ce qui pourrait faire baisser le score composite par rapport a Variation 1."
  changed_variable: "training.learning_rate (0.0002 -> 0.0001), compare a Variation 1 a epochs=5 fixe"
  expected_effect: "Variation du score composite par rapport a Variation 1 (a la hausse si la stabilite l'emporte, a la baisse si la convergence est ralentie)."
