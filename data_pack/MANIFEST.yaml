integrity:
  checksums_file: "checksums.sha256"
  freeze_required_before_distribution: true

notes:
  - "The learner pack contains data only, not generation scripts."
  - "No anonymized exercise output is distributed."
  - "The M1 annotated subset is an input dataset, not a correction key."
  - "M2 opens equipment, events and maintenance history; sensors remain closed until M3."
  - "M3 opens the 2026-S1 sensor series; the instrumented park is a deliberate subset of equipment.csv."
  - "The sensor table has no declared row identifier: the logical key must be rebuilt during M3."
  - "The M2 to M3 reference preparation is a starting point, not a correction of the M2 brief."
  - "M2 tables intentionally contain controlled pedagogical anomalies documented only in the trainer area."
  - "The optional M2 candidate release is intentionally unqualified; its presence does not authorize integration into the published tables."
  - "The M3 control lot mixes authentic and fabricated sensor rows; its oracle stays in the trainer area and its fabricated share is never published."
  - "In the control lot, an authentic row may be anomalous: the reference detector flags data quality, not fabrication."
  - "From M3 onwards, a transmitted measurement table declares provenance and procedure_id as described in SCHEMA.md."
  - "The M4-M8 RAG trajectory requires a versioned unstructured corpus; structured operational data remains accessible through typed queries or tools."
  - "The M4 sensor calibration and test sets are grouped by window_id and disjoint from the M3 control lots."
  - "M4 test labels, RAG test labels and the brief 2 challenge release remain in the trainer-only area until the documented gates."
  - "Planned files and reference runs are contracts for future module opening, not evidence that the assets are already distributed."
